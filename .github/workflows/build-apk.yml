name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache binutils \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

      - name: Install Python Packaging Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==3.0.0 virtualenv pygame==2.6.1

      - name: Validate Python Sources and Dungeon Generation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python --version
          buildozer --version
          grep -Eq '^p4a\.branch[[:space:]]*=[[:space:]]*v2024\.01\.21$' buildozer.spec
          python -m compileall -q main.py entities.py maze_generator.py p4a-recipes

      - name: Smoke Test Android Startup Path
        env:
          ANDROID_ARGUMENT: /tmp
          ANDROID_PRIVATE: /tmp
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          python - <<'PY'
          import pygame
          from main import DungeonGame, STATE_PLAYING

          game = DungeonGame()
          assert game.is_android, "Android display path was not selected"
          game.render()
          game.state = STATE_PLAYING
          game.update(0.016)
          game.render()
          assert all(dimension > 0 for dimension in game.screen.get_size())
          pygame.quit()
          PY

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer-build.log

      - name: Verify APK Native Libraries & Zero Missing SIMD Symbols
        run: |
          mkdir -p /tmp/verify-apk
          APK_PATH=$(find bin/ -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          unzip -q -o "$APK_PATH" -d /tmp/verify-apk || true
          for ARCH in arm64-v8a armeabi-v7a; do
            mkdir -p "/tmp/verify-apk/bundle-$ARCH"
            tar -xf "/tmp/verify-apk/lib/$ARCH/libpybundle.so" -C "/tmp/verify-apk/bundle-$ARCH"
            SURFACE_SO="/tmp/verify-apk/bundle-$ARCH/_python_bundle/site-packages/pygame/surface.so"
            test -f "$SURFACE_SO"
            echo "Checking $ARCH surface.so for undefined SIMD blitter symbols..."
            if readelf -sDW "$SURFACE_SO" | grep -E 'UND.*(sse2|avx2|neon|blit_blend|alphablit|premul)'; then
              echo "ERROR: Undefined SIMD blitter symbols found in $ARCH surface.so!"
              exit 1
            fi
            echo "$ARCH surface.so passed symbol verification!"
          done

      - name: Locate and Stage APK
        id: stage_apk
        run: |
          mkdir -p output_apk
          find bin/ -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonRaycast3D-Android-Debug-APK
          path: output_apk/*.apk
          retention-days: 14
          if-no-files-found: error
