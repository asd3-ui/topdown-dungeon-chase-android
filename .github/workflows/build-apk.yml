name: Build Android APK with Buildozer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache binutils \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

      - name: Install Python Packaging Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==3.0.0 virtualenv pygame==2.6.1

      - name: Validate Python Sources and Dungeon Generation
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python --version
          buildozer --version
          grep -Eq '^p4a\.branch[[:space:]]*=[[:space:]]*v2024\.01\.21$' buildozer.spec
          python -m compileall -q main.py entities.py maze_generator.py p4a-recipes

      - name: Smoke Test Android Startup Path
        env:
          ANDROID_ARGUMENT: /tmp
          ANDROID_PRIVATE: /tmp
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: |
          python - <<'PY'
          import pygame
          from main import DungeonGame, STATE_PLAYING

          game = DungeonGame()
          assert game.is_android, "Android display path was not selected"
          game.render()
          game.state = STATE_PLAYING
          game.update(0.016)
          game.render()
          assert all(dimension > 0 for dimension in game.screen.get_size())
          pygame.quit()
          PY

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee buildozer-build.log

      - name: Verify APK Native Libraries & Zero Missing SIMD Symbols
        run: |
          python - <<'PY'
          import glob, os, subprocess, tarfile, zipfile

          apks = glob.glob("bin/*.apk")
          assert apks, "No APK found in bin/"
          apk_path = apks[0]
          print("Inspecting APK:", apk_path)

          os.makedirs("/tmp/verify-apk", exist_ok=True)
          with zipfile.ZipFile(apk_path, "r") as zf:
              for member in zf.namelist():
                  if member.endswith("libpybundle.so") or member.startswith("lib/"):
                      zf.extract(member, "/tmp/verify-apk")

          for arch in ("arm64-v8a", "armeabi-v7a"):
              bundle_path = f"/tmp/verify-apk/lib/{arch}/libpybundle.so"
              assert os.path.exists(bundle_path), f"Missing {bundle_path}"
              extract_dir = f"/tmp/verify-apk/bundle-{arch}"
              os.makedirs(extract_dir, exist_ok=True)
              with tarfile.open(bundle_path, "r") as tf:
                  tf.extractall(extract_dir)

              surface_so = f"{extract_dir}/_python_bundle/site-packages/pygame/surface.so"
              assert os.path.exists(surface_so), f"Missing {surface_so}"
              out = subprocess.check_output(["readelf", "-sDW", surface_so], text=True)
              bad = []
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) >= 8 and parts[6] == "UND":
                      sym = parts[7]
                      if any(k in sym for k in ("sse2", "avx2", "neon", "blit_blend", "alphablit", "premul")):
                          bad.append(sym)
              print(f"[{arch}] Undefined SIMD blitter symbols in surface.so:", len(bad))
              assert not bad, f"Undefined SIMD symbols in {arch} surface.so: {bad}"

              dyn = subprocess.check_output(["readelf", "-d", surface_so], text=True)
              assert "libm.so" in dyn, f"Missing libm.so NEEDED in {arch} surface.so"
              print(f"[{arch}] surface.so passed symbol and libm.so verification!")
          PY

      - name: Locate and Stage APK
        id: stage_apk
        run: |
          mkdir -p output_apk
          find bin/ -name "*.apk" -exec cp {} output_apk/ \;

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonRaycast3D-Android-Debug-APK
          path: output_apk/*.apk
          retention-days: 14
          if-no-files-found: error
